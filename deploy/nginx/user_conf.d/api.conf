# Поддомен API (backend). Отдельный сертификат Let's Encrypt для
# api.yourdomain.example — тот же образ nginx-certbot выпускает его
# независимо от основного домена (см. site.conf рядом).
#
# ЗАМЕНИТЬ на реальный поддомен в ДВУХ местах: server_name ниже и во всех
# трёх путях ssl_certificate*/live/...
#
# Понадобится DNS A-запись api.yourdomain.example -> IP сервера (в дополнение
# к записям для yourdomain.example и www.yourdomain.example из site.conf).

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name api.yourdomain.example;

    ssl_certificate         /etc/letsencrypt/live/api.yourdomain.example/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/api.yourdomain.example/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.yourdomain.example/chain.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    # Аватарки сохраняются как base64 прямо в теле запроса (см.
    # avatar_max_bytes в backend_fastapi/app/config.py) — дефолтный лимит
    # nginx в 1m для них маловат.
    client_max_body_size 5m;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
