# Основной домен (frontend). Образ jonasal/nginx-certbot сам выпускает и
# продлевает сертификат Let's Encrypt для доменов, перечисленных ниже в
# server_name, и сам же обслуживает ACME-challenge и редирект с 80 порта на
# 443 — свой server-блок на 80 порту здесь заводить НЕ нужно (это уже есть
# в базовом образе). Подробности и актуальный синтаксис:
# https://github.com/JonasAlfredsson/docker-nginx-certbot (проверить перед
# первым реальным деплоем, вдруг что-то поменялось в новой версии образа).
#
# ЗАМЕНИТЬ на реальный домен в ДВУХ местах: server_name ниже и во всех трёх
# путях ssl_certificate*/live/...

server {
    listen 443 ssl default_server reuseport;
    listen [::]:443 ssl default_server reuseport;

    server_name it-hlp.com www.it-hlp.com;

    ssl_certificate         /etc/letsencrypt/live/it-hlp.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/it-hlp.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/it-hlp.com/chain.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
