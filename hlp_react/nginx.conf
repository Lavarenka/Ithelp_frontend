# Отдаёт собранный React (SPA) статикой. Реального TLS тут нет — это
# внутренний контейнер, HTTPS терминирует внешний nginx-certbot
# (см. deploy/nginx/user_conf.d/site.conf), который проксирует сюда по
# обычному http внутри docker-сети.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой путь, которого нет файлом на диске, отдаём как index.html,
    # чтобы работал React Router (иначе прямой переход на /articles/5 или
    # обновление страницы там же давали бы 404 от nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite кладёт хэш в имя файла (main.a1b2c3.js) — можно кэшировать
    # агрессивно и надолго, новая сборка будет жить уже под новым именем.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
