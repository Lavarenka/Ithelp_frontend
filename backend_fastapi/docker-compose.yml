version: "3.8"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hlp_dev
      POSTGRES_USER: hlp_dev
      POSTGRES_PASSWORD: hlp_dev
    ports:
      - "5432:5432"
    volumes:
      - hlp_pg_data:/var/lib/postgresql/data

volumes:
  hlp_pg_data:
